<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0b14'/%3E%3Crect x='5' y='18' width='3' height='9' fill='%230e388c'/%3E%3Crect x='11' y='8' width='3' height='19' fill='%233fb6dd'/%3E%3Crect x='17' y='14' width='3' height='13' fill='%234fc79e'/%3E%3Crect x='23' y='5' width='3' height='22' fill='%23d9b81f'/%3E%3C/svg%3E">
<title>hfsdr — HF SDR in the browser</title>
<meta name="description" content="The hfsdr receiver UI running as WebAssembly, driven by a synthetic HF band.">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d0b14; color: #eceaf5;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .75rem; text-align: center;
    padding: 1.5rem; font-size: .95rem; color: #adaac0;
  }
  #loading strong { color: #eceaf5; font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
  #loading .hint { font-size: .8rem; max-width: 30rem; line-height: 1.5; }
  .spinner {
    width: 1.6rem; height: 1.6rem; border-radius: 50%;
    border: 2px solid #2a2740; border-top-color: #3fb6dd;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
  <canvas id="hfsdr_canvas"></canvas>
  <div id="loading">
    <div class="spinner"></div>
    <strong>Loading hfsdr…</strong>
    <div class="hint">
      About 10&nbsp;MB of WebAssembly. Needs WebGPU or WebGL2 —
      recent Chrome, Edge, Firefox or Safari.
    </div>
  </div>
  <script type="module">
    import init from "./pkg/hfsdr.js";
    init().catch((e) => {
      const el = document.getElementById("loading");
      if (el) {
        el.innerHTML =
          "<strong>Could not start hfsdr</strong>" +
          "<div class='hint'>" + String(e) + "</div>";
      }
    });
  </script>
</body>
</html>
