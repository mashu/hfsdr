name: Deploy web app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build wasm app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The CLI must match the wasm-bindgen crate exactly or the generated glue
      # rejects the module at load time, so take the version from the lock file
      # rather than pinning it here and letting the two drift.
      - name: Resolve wasm-bindgen version
        id: wb
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen crate version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Prebuilt binary rather than `cargo install`, which builds the CLI from
      # source on every run and took ~25 minutes when this workflow first ran.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Build
        run: ./scripts/build-web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
