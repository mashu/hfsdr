[package]
name = "hfsdr"
version = "0.9.8"
edition = "2021"
description = "HF SDR client core: source-agnostic IQ pipeline (Airspy HF+, RTL-SDR, KiwiSDR, QMX)"
license = "AGPL-3.0-only"
authors = ["Mateusz Kaduk (SO5KM)"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[build-dependencies]
pkg-config = "0.3"

[dependencies]
num-complex = "0.4"
rtrb = "0.3"
rustfft = { version = "6", features = ["avx", "sse"] }
rayon = "1.10"
tungstenite = "0.29"
libloading = "0.8"
cpal = { version = "0.15", optional = true }
serialport = { version = "4", default-features = false, optional = true }
eframe = { version = "0.34", optional = true, default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.34", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
dirs = "5"
flate2 = "1.0"
rfd = { version = "0.15", optional = true }
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Pure-Rust USB, statically linked: no dlopen, no libusb, no vendor library.
# Native only — the browser transport for the same protocol is WebUSB via
# web-sys, and nusb has no wasm32 backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nusb = { version = "0.2", optional = true }

# wasm32 needs an explicit getrandom backend (transitively via tungstenite).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# Not optional: the library's KiwiSDR transport is the browser WebSocket API on
# this target, so the bindings are needed even without the GUI feature.
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "Document", "Window", "Element", "HtmlCanvasElement", "console",
    "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Event", "Location",
    "EventTarget", "Blob", "BlobPropertyBag", "Url", "Performance",
    "Request", "RequestInit", "RequestMode", "Response", "Headers", "Storage",
    "AudioContext", "BaseAudioContext", "AudioContextState", "AudioDestinationNode",
    "AudioNode", "AudioWorklet", "AudioWorkletNode", "MessagePort",
    # WebUSB: how a tab reaches a local radio without a driver. Chromium only.
    "Navigator", "Usb", "UsbDevice", "UsbDeviceFilter", "UsbDeviceRequestOptions",
    "UsbControlTransferParameters", "UsbRecipient", "UsbRequestType",
    "UsbInTransferResult", "UsbOutTransferResult", "UsbTransferStatus",
    "UsbConfiguration",
] }
# std::time::Instant panics on wasm32-unknown-unknown ("time not implemented");
# web-time is a drop-in backed by performance.now().
web-time = "1"

[features]
default = ["airspy"]
# Runtime-loaded libairspyhf on Windows, Linux, and macOS.
airspy = []
# Runtime-loaded librtlsdr on Windows, Linux, and macOS.
rtlsdr = []
# QRP Labs QMX/QMX+ via USB CAT + audio IQ (pure Rust).
qmx = ["dep:serialport", "dep:cpal"]
# Runtime-loaded libSoapySDR on Windows, Linux, and macOS.
soapy = []
# Airspy HF+ over a statically linked, pure-Rust USB stack (nusb): no dlopen,
# no libusb, no libairspyhf. The protocol itself is always compiled — see
# `usb::airspyhf` — and this only adds the native transport that executes it.
airspyhf-usb = ["dep:nusb"]
# UI dependencies shared by the desktop and browser builds. The hfsdr binary
# needs only these; everything platform-specific hangs off gui-core.
gui-base = ["dep:eframe", "dep:egui_extras", "dep:serde", "dep:serde_json"]
# GUI without librtlsdr / SoapySDR (Kiwi/QMX-only builds).
gui-core = ["gui-base", "dep:cpal", "dep:ureq", "dep:rfd", "qmx"]
gui = ["gui-core", "rtlsdr", "soapy"]
# Browser build: eframe only. No serialport (qmx), no ureq (needs real sockets),
# no native drivers. KiwiSDR over the browser WebSocket API is the only source.
# Browser build of the real UI. Excludes cpal, rfd, ureq and serialport (qmx):
# none of them work on wasm32, and the browser has its own equivalents.
gui-web = ["gui-base", "dep:wasm-bindgen-futures"]

[[bin]]
name = "hfsdr"
path = "src/bin/waterfall/main.rs"
required-features = ["gui-base"]

[[bin]]
name = "airspy-probe"
path = "src/bin/airspy_probe.rs"
required-features = ["airspy"]

[[bin]]
name = "pipeline-bench"
path = "src/bin/pipeline_bench.rs"
required-features = ["airspy"]

[[bin]]
name = "engine-bench"
path = "src/bin/waterfall/bench_main.rs"
required-features = ["gui-core"]

# Only built when the native USB transport is enabled; without it there is no
# nusb and nothing for the example to open.
[[example]]
name = "usb_probe"
required-features = ["airspyhf-usb"]

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["eframe", "wgpu"] }
pollster = "0.4"
